<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคิด BMI</title>
</head>
<body>
    <h1>เครื่องคิด BMI</h1>

    <p>
        น้ำหนัก (กก.)
        <input id="weight">
    </p>

    <p>
        ส่วนสูง (ซม.)
        <input id="height">
    </p>

    <button id="calc">คำนวณ</button>

    <p id="result"></p>

    <script>
        document.getElementById("calc").addEventListener("click", function () {
            // อ่านค่า .value ภายใน function ตอนกดปุ่ม
            const weight = parseFloat(
                document.getElementById("weight").value
            );

            const heightCm = parseFloat(
                document.getElementById("height").value
            );

            // ตรวจสอบว่ากรอกข้อมูลถูกต้องหรือไม่
            if (
                isNaN(weight) ||
                isNaN(heightCm) ||
                weight <= 0 ||
                heightCm <= 0
            ) {
                document.getElementById("result").innerText =
                    "กรุณากรอกน้ำหนักและส่วนสูง";
                return;
            }

            // แปลงส่วนสูงจากเซนติเมตรเป็นเมตรก่อน
            const heightM = heightCm / 100;

            // คำนวณ BMI
            const bmi = weight / (heightM * heightM);

            let category;

            // BMI น้อยกว่า 18.5
            if (bmi < 18.5) {
                category = "น้ำหนักน้อย";
            }
            // BMI ตั้งแต่ 18.5 ขึ้นไป แต่น้อยกว่า 25
            else if (bmi < 25) {
                category = "ปกติ";
            }
            // BMI ตั้งแต่ 25 ขึ้นไป
            else {
                category = "น้ำหนักเกิน";
            }

            // แสดงผลลัพธ์
            document.getElementById("result").innerText =
                "BMI " + bmi.toFixed(1) + " (" + category + ")";
        });
    </script>
</body>
</html>
