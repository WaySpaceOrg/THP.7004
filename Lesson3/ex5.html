<button id="shake">เขย่าเซียมซี</button>
<p id="fortune"></p>

<script>
    const fortunes = ["โชคดีมาก", "โชคดี", "เฉยๆ", "ระวังตัว", "รอก่อน"];

    document.getElementById("shake").addEventListener("click", function () {
        const i = Math.floor(Math.random() * fortunes.length);   // 0–4
        document.getElementById("fortune").textContent = "ใบที่ " + (i + 1) + ": " + fortunes[i];
    });

    // สลับโหมดกลางคืน
    // document.body.classList.toggle("dark");
</script>
