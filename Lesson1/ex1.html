<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7dce5">
<title>ประวัติส่วนตัว · THP.7004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#bd6681;--deep:#98506b;--cream:#fffaf6;--ink:#513844;--muted:#927984;--line:#efdce2;--shadow:0 16px 45px #9b64721a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Prompt,sans-serif;background:radial-gradient(circle at 8% 5%,#fceaf0,transparent 28rem),radial-gradient(circle at 95% 35%,#f8e9e8,transparent 25rem),var(--cream)}
.wrap{width:min(1080px,calc(100% - 40px));margin:auto}
header{padding:24px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{font:800 13px "DM Sans";letter-spacing:.18em;color:var(--ink)}
.brand span{color:var(--rose)}
.back{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border:1px solid #d9adbb;border-radius:999px;background:#fff9fa;color:var(--deep);font-size:12px;font-weight:600;text-decoration:none;transition:.2s}
.back:hover{background:#f7e1e8;transform:translateY(-2px)}
main{padding:34px 0 70px}
.eyebrow{font:700 11px "DM Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--deep)}
.hero{position:relative;overflow:hidden;padding:clamp(28px,6vw,58px);border:1px solid #efd6df;border-radius:30px;background:linear-gradient(120deg,#fff8faed,#f4dce5ed);box-shadow:var(--shadow)}
.hero:after{content:"✿";position:absolute;right:4%;top:-40px;font:210px Georgia;color:#bd66811a;pointer-events:none}
h1{position:relative;z-index:1;margin:12px 0 8px;font-size:clamp(34px,6vw,54px);line-height:1.2;letter-spacing:-.04em}
h1 em{font-style:normal;color:var(--rose)}
.lead{position:relative;z-index:1;margin:0;color:var(--muted);font-size:14px;line-height:1.9}
.profile{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:30px}
.info{padding:20px 22px;border:1px solid var(--line);border-radius:18px;background:#ffffffc9}
.info small{display:block;margin-bottom:8px;color:var(--muted);font:700 10px "DM Sans";letter-spacing:.15em;text-transform:uppercase}
.info strong{font-size:20px;font-weight:600;overflow-wrap:anywhere}
.footer-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 19px;border-radius:999px;text-decoration:none;font-size:12px;font-weight:600;transition:.2s}
.nav-btn.primary{background:var(--deep);color:white;box-shadow:0 8px 20px #98506b30}
.nav-btn.primary:hover{background:#81415a;transform:translateY(-2px)}
.nav-btn.soft{border:1px solid var(--line);background:#fff9fa;color:var(--deep)}
.nav-btn.soft:hover{border-color:#d9adbb;background:#fff0f4}
footer{text-align:center;padding:28px 0;color:#a78692;font-size:11px;letter-spacing:.08em}
footer b{color:var(--rose)}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.brand{font-size:11px}.back{padding:9px 12px;font-size:11px}.profile{grid-template-columns:1fr}.hero:after{right:-25px;font-size:160px}.footer-nav{align-items:stretch}.nav-btn{padding:11px 13px;font-size:11px}}
</style>
</head>
<body>
<header class="wrap">
<nav class="topbar" aria-label="เมนูหลัก">
<div class="brand">MY LITTLE <span>WEB SPACE</span></div>
<a class="back" href="../index.html"><span aria-hidden="true">←</span> กลับหน้าหลัก</a>
</nav>
</header>
<main class="wrap">
<section class="hero" aria-labelledby="page-title">
<div class="eyebrow">Lesson 01 · Exercise 01</div>
<h1 id="page-title">ประวัติส่วนตัว<span style="color:var(--rose)">.</span></h1>
<p class="lead">ยินดีต้อนรับสู่หน้าแนะนำตัวของฉัน — เริ่มต้นการเรียนรู้ HTML ไปด้วยกัน ♡</p>
<div class="profile">
<div class="info"><small>Name</small><strong>Aungsumalin Chumbunyang</strong></div>
<div class="info"><small>Number</small><strong>420</strong></div>
<div class="info" style="grid-column:1/-1"><small>Personal note</small><strong>22222222222222</strong></div>
</div>
</section>
<nav class="footer-nav" aria-label="นำทางระหว่างบทเรียน">
<a class="nav-btn soft" href="../index.html#lessons">♡ บทเรียนทั้งหมด</a>
<a class="nav-btn primary" href="ex2.html">แบบฝึกหัดถัดไป <span aria-hidden="true">→</span></a>
</nav>
</main>
<footer class="wrap">MADE WITH <b>♡</b> AND A LITTLE BIT OF CODE · THP.7004</footer>
</body>
</html>
